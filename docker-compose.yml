version: "3.8"

services:
  lb:
    build: .
    command: load_balancer_l4
    ports:
      - "8080:8080"
      - "3000:3000"
    environment:
      - LISTEN_ADDR=0.0.0.0:8080
      - BACKENDS=backend1:8081,backend2:8082,backend3:8083,backend4:8084
      - WEIGHTS=3,1,1,1
      - ALGORITHM=2
      - REDIS_URL=redis://redis:6379/
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  backend1:
    build: .
    command: backend
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: '0.60' # Capacidade proporcional ao peso 3
          memory: 128M
    restart: unless-stopped

  backend2:
    build: .
    command: backend
    environment:
      - PORT=8082
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          cpus: '0.20' # Capacidade proporcional ao peso 1
          memory: 64M
    restart: unless-stopped

  backend3:
    build: .
    command: backend
    environment:
      - PORT=8083
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          cpus: '0.20' # Capacidade proporcional ao peso 1
          memory: 64M
    restart: unless-stopped

  backend4:
    build: .
    command: backend
    environment:
      - PORT=8084
    ports:
      - "8084:8084"
    deploy:
      resources:
        limits:
          cpus: '0.20' # Capacidade proporcional ao peso 1
          memory: 64M
    restart: unless-stopped

  health_checker:
    build: .
    command: health_checker
    environment:
      - BACKENDS=backend1:8081,backend2:8082,backend3:8083,backend4:8084
      - WEIGHTS=3,1,1,1
      - REDIS_URL=redis://redis:6379/
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    restart: unless-stopped